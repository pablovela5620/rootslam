default:
  image: registry.freedesktop.org/mateosss/basalt:tsantucci-ubuntu2404

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GET_DATASET_LOCKFILE: "/scratch/uncompression.lock"
  ROOTBA_REPO: "https://github.com/TomasSantucci/rootba.git"
  ROOTBA_REF: "fixed-intrinsics"

stages:
  - prepare
  - evalsets
  - timing
  - results

.ccache:
  before_script:
    - export CCACHE_BASEDIR="$PWD"
    - export CCACHE_DIR="/ccache"
    - export CCACHE_COMPILERCHECK=content
    - ccache --zero-stats || true
    - ccache --show-stats || true
  after_script:
    - export CCACHE_DIR="/ccache"
    - ccache --show-stats -v

build:
  stage: prepare
  extends: .ccache
  script:
    - time cmake --preset=development -DBASALT_INSTANTIATIONS_DOUBLE=off -DBLA_VENDOR=OpenBLAS
    - time cmake --build build --target basalt_vio
    - rm -f $GET_DATASET_LOCKFILE
    - ls /scratch
    - pushd /scratch/rootba
    - export GIT_TERMINAL_PROMPT=0
    - git remote -v
    - git config --get-regexp '^credential\.|^http\.|^url\.' || true
    - |
      # rootba is public, but the fetch intermittently gets a 401 from GitHub
      # (the image's git config can hand it stale credentials), which turns
      # into a username prompt and kills the job. Fetch without credential
      # helpers, retry, and fall back to the rootba already in the image.
      set -eu
      GIT="git -c credential.helper= -c http.extraheader="
      FETCHED=0
      for i in 1 2 3; do
          if $GIT fetch --no-tags "$ROOTBA_REPO" "$ROOTBA_REF"; then FETCHED=1; break; fi
          echo "rootba fetch attempt $i failed, retrying in 10s"
          sleep 10
      done
      if [ "$FETCHED" = 1 ]; then
          git checkout -f FETCH_HEAD
      else
          echo "WARNING: could not fetch $ROOTBA_REF from $ROOTBA_REPO"
          echo "WARNING: building the rootba checkout baked into the image instead"
          GIT_CURL_VERBOSE=1 $GIT ls-remote "$ROOTBA_REPO" "$ROOTBA_REF" 2>&1 | tail -n 40 || true
      fi
      echo "Building rootba at:"
      git log -1 --oneline
    - ./scripts/build-external.sh
    - ./scripts/build-rootba.sh
    - popd
    - cp /scratch/rootba/bin/bal build/bal
    - ls build
  artifacts:
    paths:
      - build/basalt_vio
      - build/bal
    expire_in: 52 weeks

.run-dataset:
  allow_failure: true
  variables:
    DATASET: ""
    DETERMINISTIC: 0
    REPETITIONS: 1
    NUM_THREADS: 0
    RESULTS_DIR: output
  script:
    - echo "Running dataset $DATASET"
    - echo $DETERMINISTIC, $NUM_THREADS, $REPETITIONS, $RESULTS_DIR
    - export DS_DEV=$(jq -r .sequences.$DATASET.device .ci/evaluation.json)
    - export DS_REL_PATH=$(jq -r .sequences.$DATASET.path .ci/evaluation.json)
    - export DS_NAME=$(basename $DS_REL_PATH)
    - export DS_PATH=/$DS_DEV/$DS_REL_PATH
    - export DS_CONFIG=$(jq -r .configs.$DS_DEV .ci/evaluation.json)
    - export DS_CALIB=$(jq -r .calibs.$DS_DEV .ci/evaluation.json)
    - export DS_FORMAT=$(jq -r .formats.$DS_DEV .ci/evaluation.json)
    - echo $DATASET, $DS_DEV, $DS_REL_PATH, $DS_NAME, $DS_PATH, $DS_CONFIG, $DS_CALIB, $DS_FORMAT
    - echo Runner variables $GET_DATASET_LOCKFILE
    - ls /msdmo /msdmi /msdmg /euroc /tumvi /hilti26
    - python3 -u .ci/get_dataset.py $DS_PATH /scratch --lock_file $GET_DATASET_LOCKFILE | tee get_dataset.log
    - export FINAL_DS_PATH=$(cat get_dataset.log | tail -n 1)
    - echo $FINAL_DS_PATH | tee FINAL_DS_PATH.txt
    - echo $DS_PATH | tee DS_PATH.txt
    - ls
    - |
      set -euo pipefail
      for i in $(seq 1 $REPETITIONS)
      do
          echo "Run repetition $i / $REPETITIONS"
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 gdb -batch -ex run -ex bt --args ./build/basalt_vio --save-times 1 --show-gui 0 --deterministic $DETERMINISTIC --num-threads $NUM_THREADS --dataset-path $FINAL_DS_PATH --dataset-type $DS_FORMAT --cam-calib $DS_CALIB --config-path $DS_CONFIG --save-trajectory euroc --save-trajectory-fn tracking.$DATASET.csv --map-export-path map 2>&1 | tee output.$DATASET.log || true
          ./build/bal --input map/map.json --solver-type SQUARE_ROOT --calibration-file $DS_CALIB --no-normalize --residual-robust-norm HUBER --no-use-double --optimized-cost ERROR_VALID --output-optimized-path map/optimized_tracking.csv --min-obs-per-kf 20 2>&1 | tee output.$DATASET.bal.log
          ./build/bal --input map/map.json --solver-type SQUARE_ROOT --calibration-file $DS_CALIB --no-normalize --residual-robust-norm HUBER --no-use-double --optimized-cost ERROR_VALID --output-optimized-path map/optimized_tracking_pg.csv --min-obs-per-kf 10 --pose-graph-file map/pose_graph.json 2>&1 | tee output.$DATASET.balpg.log
          ls
          source /xrtmet/.venv-docker/bin/activate
          /xrtmet/ops/merge_frames_keyframes.py rt_tracking.$DATASET.csv map/kf_trajectory.csv f_tracking.csv
          /xrtmet/ops/merge_frames_keyframes.py rt_tracking.$DATASET.csv map/optimized_tracking.csv f_optimized_tracking.csv
          /xrtmet/ops/merge_frames_keyframes.py rt_tracking.$DATASET.csv map/optimized_tracking_pg.csv f_optimized_tracking_pg.csv
          export RESDIR=$RESULTS_DIR/$CI_COMMIT_SHORT_SHA-$i/$DATASET
          export RESDIRBA=$RESULTS_DIR/$CI_COMMIT_SHORT_SHA-ba-$i/$DATASET
          export RESDIRBAPG=$RESULTS_DIR/$CI_COMMIT_SHORT_SHA-bapg-$i/$DATASET
          echo "Results will be saved in $RESDIR"
          mkdir -p $RESDIR
          mv f_tracking.csv $RESDIR/tracking.csv
          mv kf_timing.tracking.$DATASET.csv $RESDIR/kf_timing.csv
          mv timing.tracking.$DATASET.csv $RESDIR/timing.csv
          mv stats_vio.json $RESDIR/stats_vio.json
          mv output.$DATASET.log $RESDIR/output.log
          echo "Full bundle adjustment results will be saved in $RESDIRBA"
          mkdir -p $RESDIRBA
          mv f_optimized_tracking.csv $RESDIRBA/tracking.csv
          cp $RESDIR/timing.csv $RESDIRBA/timing.csv
          cp $RESDIR/stats_vio.json $RESDIRBA/stats_vio.json
          mv output.$DATASET.bal.log $RESDIRBA/output_bal.log
          echo "Pose-graph-constrained bundle adjustment results will be saved in $RESDIRBAPG"
          mkdir -p $RESDIRBAPG
          mv f_optimized_tracking_pg.csv $RESDIRBAPG/tracking.csv
          cp $RESDIR/timing.csv $RESDIRBAPG/timing.csv
          cp $RESDIR/stats_vio.json $RESDIRBAPG/stats_vio.json
          mv output.$DATASET.balpg.log $RESDIRBAPG/output_bal.log
          tree $RESDIR
          tree $RESDIRBA
          tree $RESDIRBAPG
      done
    - echo "Runs completed"
  after_script:
    - echo "Deleting dataset"
    - export FINAL_DS_PATH=$(cat FINAL_DS_PATH.txt)
    - export DS_PATH=$(cat DS_PATH.txt)
    - if [ "$FINAL_DS_PATH" != "$DS_PATH" ]; then echo "Deleting $FINAL_DS_PATH"; rm -rf $FINAL_DS_PATH; fi
  artifacts:
    paths:
      - $RESULTS_DIR
    expire_in: 52 weeks
    name: "$RESULTS_DIR-$DATASET"

{evalsets_jobs}

{timing_jobs}

zip:
  stage: results
  tags: [basalt-evaluation-box]
  script:
    - |
      echo "# Results"
      echo "- Project: <$CI_PROJECT_URL>" >> results/README.md
      echo "- Deterministic: {deterministic}" >> results/README.md
      echo "- Num threads: {num_threads}" >> results/README.md
      echo "- Evaluation sets: {evalset_list}" >> results/README.md
      echo "- Branch: $CI_COMMIT_REF_NAME" >> results/README.md
      echo "- Commit: $CI_COMMIT_SHORT_SHA" >> results/README.md
      echo "- Commit URL: <$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA>" >> results/README.md
      echo "- Pipeline: $CI_PIPELINE_ID" >> results/README.md
      echo "- Pipeline URL: <$CI_PIPELINE_URL>" >> results/README.md
      echo "- Job: $CI_JOB_ID" >> results/README.md
      echo "- Job URL: <$CI_JOB_URL>" >> results/README.md
      echo "- CPU: $(awk -F': ' '/model name|Processor/ {{print $2; exit}}' /proc/cpuinfo)" >> results/README.md
      echo "- RAM: $(awk '/MemTotal/ {{printf "%.0fGB", $2*1024/1000^3}}' /proc/meminfo)" >> results/README.md
    - tree results
    - zip -r results.zip results
    - |
      echo "# Timing Results"
      echo "- Project: <$CI_PROJECT_URL>" >> timing-results/README.md
      echo "- Deterministic: {timing_deterministic}" >> timing-results/README.md
      echo "- Num threads: {timing_num_threads}" >> timing-results/README.md
      echo "- Repetitions: {timing_repetitions}" >> timing-results/README.md
      echo "- Evaluation sets: {timing_evalset_list}" >> timing-results/README.md
      echo "- Branch: $CI_COMMIT_REF_NAME" >> timing-results/README.md
      echo "- Commit: $CI_COMMIT_SHORT_SHA" >> timing-results/README.md
      echo "- Commit URL: <$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA>" >> timing-results/README.md
      echo "- Pipeline: $CI_PIPELINE_ID" >> timing-results/README.md
      echo "- Pipeline URL: <$CI_PIPELINE_URL>" >> timing-results/README.md
      echo "- Job: $CI_JOB_ID" >> timing-results/README.md
      echo "- Job URL: <$CI_JOB_URL>" >> timing-results/README.md
      echo "- CPU: $(awk -F': ' '/model name|Processor/ {{print $2; exit}}' /proc/cpuinfo)" >> timing-results/README.md
      echo "- RAM: $(awk '/MemTotal/ {{printf "%.0fGB", $2*1024/1000^3}}' /proc/meminfo)" >> timing-results/README.md
    - tree timing-results
    - zip -r timing-results.zip timing-results
    - rm  -f $GET_DATASET_LOCKFILE
  artifacts:
    name: "results"
    expose_as: "Archive of trajectories"
    paths:
      - results.zip
      - timing-results.zip
